# Unsigned iOS build check.
#
# ASSUMPTIONS / KNOWN GAPS (see .junie/guidelines.md and project notes for background):
# - KorGE's targetIos() generates its own Xcode project under build/platforms/ios via
#   Gradle tasks like `iosBuildSimulatorDebug` (confirmed at https://docs.korge.org/targets/ios/).
#   This is KorGE's own pipeline, NOT the standard Kotlin Multiplatform `cocoapods {}` plugin -
#   nothing in KorGE's docs mentions CocoaPods.
# - RevenueCat's purchases-kmp-core:2.10.2+17.55.1 needs `pod 'PurchasesHybridCommon', '17.55.1'`
#   linked into the final iOS app/framework. There is currently no Podfile anywhere in this repo,
#   and it's unknown whether KorGE's generated Xcode project has a hook for injecting one.
# - This workflow attempts the real KorGE build task (the actual signal we need), then checks
#   whether a Podfile shows up under the generated project so `pod install` can run. If none is
#   found, it explains that rather than failing silently or faking success.
# - No code signing / TestFlight upload here on purpose - unsigned simulator build only, for now.

name: "🍎 iOS Build"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  JAVA_DISTRIBUTION: zulu
  JAVA_VERSION: 21

concurrency:
  group: "ios-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - { uses: actions/checkout@v4 }

      - { name: Set up JDK, uses: actions/setup-java@v3, with: { distribution: "${{ env.JAVA_DISTRIBUTION }}", java-version: "${{ env.JAVA_VERSION }}" } }

      - { name: Prepare Gradle, uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 } # v3.1.0

      # gradlew's executable bit isn't preserved when committed from Windows.
      - { name: Make gradlew executable, run: chmod +x ./gradlew }

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          ruby --version
          pod --version || echo "CocoaPods not yet installed"

      - name: Install CocoaPods (if not already present on the runner image)
        run: |
          if ! gem list -i cocoapods > /dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      # This is the actual gate: does the KorGE + Kotlin/Native + RevenueCat toolchain
      # produce an unsigned iOS Simulator build at all. Expected to be the first place
      # a CocoaPods-related link failure would surface, if one exists.
      #
      # --no-configuration-cache: KorGE's Gradle plugin isn't compatible with Gradle's
      # configuration cache (project.gradle.properties has org.gradle.configuration-cache=true
      # globally, which works fine for JVM/JS builds). With it enabled here, the iOS task
      # throws NullPointerExceptions inside the plugin (getKorge/execLogger null) preceded by
      # "cannot serialize object of type Project" warnings - the cache corrupts the plugin's
      # internal state. Disabled for this invocation only, not project-wide.
      - name: Build unsigned iOS Simulator app (KorGE)
        run: ./gradlew iosBuildSimulatorDebug --no-configuration-cache --stacktrace

      # SPIKE, not part of the real game build: paywall-build is a separate Gradle build
      # (includeBuild) testing whether RevenueCat 3.6.0 actually works for iOS under Kotlin
      # 2.3.20 - something that can't be tested on the Windows dev machine, since Kotlin/Native
      # iOS targets are disabled there and these tasks silently no-op. Nothing in the main
      # iosBuildSimulatorDebug task graph touches this separately-included build, so it needs
      # its own explicit invocation here.
      #
      # compileKotlinIosSimulatorArm64 already confirmed green in a prior run (the klib reads
      # fine under 2.3.20). This step goes one step further: paywall-build now declares a real
      # binaries.framework { baseName = "PaywallModule" } output and calls Purchases.configure()
      # from iosMain, so linkDebugFrameworkIosSimulatorArm64 actually has to link RevenueCat's
      # bundled native code into a real framework - the exact step that killed every earlier
      # RevenueCat version here (missing PurchasesHybridCommon via CocoaPods). RevenueCat 3.x's
      # pitch is that it bundles its native SDK directly, avoiding that - this step tests it.
      #
      # continue-on-error: true - a failure here is expected spike output, not a real build
      # regression, and must not be conflated with the main game build's own pass/fail above.
      - name: "SPIKE: link paywall-build framework for iOS (RevenueCat 3.6.0 / Kotlin 2.3.20)"
        continue-on-error: true
        run: ./gradlew :paywall-build:linkDebugFrameworkIosSimulatorArm64 --no-configuration-cache --stacktrace

      # --- Native shell app (ios-shell/) ---
      #
      # Hand-authored via XcodeGen, deliberately NOT KorGE's own generated project under
      # build/platforms/ios. First real attempt to embed BOTH GameMain.framework (:game,
      # Kotlin 2.0.20, built by the "Build unsigned iOS Simulator app" step above) and
      # PaywallModule.framework (paywall-build, Kotlin 2.3.20, built by the spike step above)
      # into ONE running process. This is a genuinely open question, not just "does it build" -
      # each Kotlin/Native framework embeds its own copy of the Kotlin/Native runtime, and linking
      # two independently-compiled ones together is a known source of duplicate-symbol link
      # errors. continue-on-error: true on every step here for the same reason as the spike
      # above: a failure must not be conflated with the main game build's own pass/fail, and per
      # this file's own established rule, the API's "conclusion" field for a continue-on-error
      # step is NOT reliable - read the raw log for BUILD SUCCEEDED/FAILED and the actual printed
      # "Storage bridge result:" line, never just the green check.
      - name: "Shell app: install XcodeGen (if not already present on the runner image)"
        continue-on-error: true
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: "Shell app: generate Xcode project from ios-shell/project.yml"
        continue-on-error: true
        run: |
          cd ios-shell
          xcodegen generate --spec project.yml

      - name: "Shell app: build (embeds GameMain.framework + PaywallModule.framework)"
        continue-on-error: true
        run: |
          xcodebuild -project ios-shell/ShellApp.xcodeproj -scheme ShellApp \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath ios-shell/build build

      - name: "Shell app: boot simulator, install, launch, verify on-device storage bridge"
        continue-on-error: true
        run: |
          set -e
          APP_PATH=$(find ios-shell/build -name "ShellApp.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ShellApp.app not found - the build step above likely failed. See its log."
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          BUNDLE_ID="com.infiltrate.shellapp"
          # Plain-text simctl output, not -j/JSON, specifically to avoid embedding a Python
          # script inside this YAML block (a leading-indented python3 -c heredoc throws
          # IndentationError on its first line - caught locally, not risking it in CI).
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found on this runner."
            exit 1
          fi
          echo "Using simulator device: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5

          CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" "$BUNDLE_ID" data)
          RESULT_FILE="$CONTAINER/Documents/storage_bridge_result.txt"
          if [ ! -f "$RESULT_FILE" ]; then
            echo "storage_bridge_result.txt not found under $CONTAINER/Documents - app may have crashed on launch. Check the simulator's device log."
            exit 1
          fi
          RESULT=$(cat "$RESULT_FILE")
          echo "Storage bridge result: $RESULT"
          if [ "$RESULT" != "OK" ]; then
            echo "Storage bridge round-trip FAILED on-device: $RESULT"
            exit 1
          fi
          echo "Storage bridge round-trip verified ON-DEVICE (not just JVM-logical): OK"
        id: boot_shell

      # SPIKE: Compose<->KorGE view-switching cost measurement (see .junie/guidelines.md).
      # The app is already running from the step above (storage bridge check happens on the
      # same launch) and has already started its automated 6-cycle switch measurement 1s after
      # launch. This step just waits for it to finish (polling for the result file, since total
      # duration depends on how slow the real cold-start-on-first-switch turns out to be - not
      # assumed in advance) and captures periodic screenshots throughout so a human can visually
      # check for flashes/glitches, since headless CI has no way to detect those on its own.
      - name: "Shell app: wait for switch-spike cycles, capture screenshots, read result"
        continue-on-error: true
        run: |
          DEVICE_ID="${{ steps.boot_shell.outputs.device_id }}"
          BUNDLE_ID="com.infiltrate.shellapp"
          mkdir -p ios-shell/spike-screenshots

          CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" "$BUNDLE_ID" data)
          RESULT_FILE="$CONTAINER/Documents/switch_spike_result.txt"

          # Worst case (every one of the 6 cycles hitting its own timeout) is ~75s; 100s gives
          # comfortable margin without assuming in advance how slow the real cold start is.
          for i in $(seq 1 100); do
            xcrun simctl io "$DEVICE_ID" screenshot "ios-shell/spike-screenshots/frame_$(printf '%03d' "$i").png" || true
            if [ -f "$RESULT_FILE" ]; then
              echo "Result file appeared after ~${i}s of polling."
              break
            fi
            sleep 1
          done

          if [ ! -f "$RESULT_FILE" ]; then
            echo "switch_spike_result.txt never appeared after 100s - app may have hung or crashed mid-cycle. Check device log."
            exit 1
          fi

          echo "===== SWITCH SPIKE RESULT ====="
          cat "$RESULT_FILE"
          echo "================================"

      - name: Upload switch-spike screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-spike-screenshots
          path: ios-shell/spike-screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Upload shell app build output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-app
          path: |
            ios-shell/build
            ios-shell/project.yml
          if-no-files-found: warn
          retention-days: 7

      - name: Check for a generated Podfile and run pod install if present
        if: always()
        run: |
          PODFILE=$(find build/platforms/ios -iname "Podfile" 2>/dev/null | head -n 1)
          if [ -n "$PODFILE" ]; then
            echo "Found Podfile at: $PODFILE"
            pod install --project-directory="$(dirname "$PODFILE")"
          else
            echo "No Podfile found under build/platforms/ios."
            echo "KorGE's Xcode project generator does not appear to wire CocoaPods in automatically."
            echo "RevenueCat purchases-kmp-core 1.9.0+14.3.0 needs PurchasesHybridCommon (14.3.0)"
            echo "linked in via CocoaPods - this likely needs a Podfile authored and placed into"
            echo "build/platforms/ios (or copied in by a build step) before pod install has anything to do."
          fi

      - name: Upload generated Xcode project for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: build/platforms/ios
          if-no-files-found: warn
          retention-days: 7
