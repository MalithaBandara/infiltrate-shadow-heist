name: "🍎 iOS TestFlight Release"

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "App Store build number (CFBundleVersion)"
        required: false
        default: "19"
  push:
    tags:
      - "v*"

env:
  JAVA_DISTRIBUTION: zulu
  JAVA_VERSION: 21

concurrency:
  group: "ios-testflight-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: "${{ env.JAVA_DISTRIBUTION }}"
          java-version: "${{ env.JAVA_VERSION }}"

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          pod --version || echo "CocoaPods not yet installed"

      - name: Install CocoaPods & XcodeGen (if needed)
        run: |
          if ! gem list -i cocoapods > /dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          pod --version
          xcodegen --version

      - name: Install Apple Distribution Certificate in Keychain
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          echo "$CERT_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PP_DIR/ShadowHeist_AppStore.mobileprovision"

          # Extract UUID and copy with UUID filename for Xcode manual signing match
          UUID=$(openssl smime -inform DER -verify -in "$PP_DIR/ShadowHeist_AppStore.mobileprovision" -noverify 2>/dev/null | grep -A1 "<key>UUID</key>" | tail -n1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          if [ -n "$UUID" ]; then
            echo "Installed profile UUID: $UUID"
            cp "$PP_DIR/ShadowHeist_AppStore.mobileprovision" "$PP_DIR/${UUID}.mobileprovision"
          fi

      - name: Build KorGE GameMain release framework (iosArm64)
        run: ./gradlew linkReleaseFrameworkIosArm64 --no-configuration-cache --stacktrace

      - name: Build PaywallModule release framework (iosArm64)
        run: ./gradlew :paywall-build:linkPodReleaseFrameworkIosArm64 --no-configuration-cache --stacktrace

      - name: Sync Compose Multiplatform resources for iOS Device
        run: |
          ./gradlew :paywall-build:syncPodComposeResourcesForIos --no-configuration-cache --stacktrace \
            -Pcompose.ios.resources.platform=iphoneos \
            -Pcompose.ios.resources.archs=arm64

      - name: Generate Xcode project from ios-shell/project.yml
        run: |
          mkdir -p ios-shell/Frameworks
          cp -R build/bin/iosArm64/releaseFramework/GameMain.framework ios-shell/Frameworks/
          cp -R paywall-build/build/bin/iosArm64/podReleaseFramework/PaywallModule.framework ios-shell/Frameworks/
          cd ios-shell
          xcodegen generate --spec project.yml

      - name: Set dynamic build number (if provided)
        if: "${{ github.event.inputs.build_number != '' }}"
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          echo "Setting CFBundleVersion to $BUILD_NUM in Info.plist..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios-shell/Generated/Info.plist

      - name: Archive ShellApp (Device / Release)
        run: |
          xcodebuild -project ios-shell/ShellApp.xcodeproj -scheme ShellApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios-shell/build/ShellApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="ShadowHeist_AppStore" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="AGLKGW9XC9" \
            archive

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath ios-shell/build/ShellApp.xcarchive \
            -exportOptionsPlist ios-shell/ExportOptions.plist \
            -exportPath ios-shell/build/export

      - name: Set up App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 ~/.private_keys/

      - name: Upload .ipa to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          IPA_PATH="ios-shell/build/export/ShellApp.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "IPA file not found at $IPA_PATH"
            exit 1
          fi
          echo "Uploading $IPA_PATH to TestFlight..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --show-progress

      - name: Upload TestFlight IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-ipa
          path: ios-shell/build/export/ShellApp.ipa
