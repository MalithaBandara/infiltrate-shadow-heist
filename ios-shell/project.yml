name: ShellApp
options:
  bundleIdPrefix: com.infiltrate
  deploymentTarget:
    iOS: "15.0"

targets:
  ShellApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infiltrate.shellapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # GameMain.framework and PaywallModule.framework are both built from the Kotlin/Native
        # iosSimulatorArm64 target only (arm64, no x86_64 slice). Without this, a plain
        # `xcodebuild -sdk iphonesimulator` build (no -destination given) defaults to building
        # BOTH arm64 and x86_64 simulator slices, and the x86_64 link fails with "Undefined
        # symbols" because ld just ignores the arm64-only .framework files for that arch -
        # confirmed exactly this way in CI on 2026-08-31. This is the standard fix for an
        # Apple-Silicon-only binary framework, independent of whatever -destination gets picked.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../build/bin/iosSimulatorArm64/debugFramework"
          - "$(PROJECT_DIR)/../paywall-build/build/bin/iosSimulatorArm64/debugFramework"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Shadow Heist Shell
        UILaunchScreen: {}
        # Compose Multiplatform's ComposeUIViewController deliberately crashes (via its own
        # PlistSanityCheck, dispatched on a low-priority background queue - see
        # .junie/guidelines.md for the full trace) if this is missing/false. Unrelated to the
        # switch-spike mechanism itself; needed by any Compose-on-iOS app regardless.
        CADisableMinimumFrameDurationOnPhone: true
    dependencies:
      # Paths are relative to this file (ios-shell/project.yml), pointing at the standard
      # Kotlin/Native debug framework output locations - :game's is confirmed against a real CI
      # log (see .junie/guidelines.md, "LOCKED WORKING CONFIGURATION"); paywall-build's follows
      # the same Kotlin/Native convention but hasn't been confirmed against a real build output
      # yet (compileKotlinIosSimulatorArm64 has run here; linkDebugFrameworkIosSimulatorArm64,
      # which actually produces the .framework, has only ever run in CI, not on this machine).
      - framework: ../build/bin/iosSimulatorArm64/debugFramework/GameMain.framework
        embed: true
        codeSign: false
      - framework: ../paywall-build/build/bin/iosSimulatorArm64/debugFramework/PaywallModule.framework
        embed: true
        codeSign: false
