name: ShellApp
options:
  bundleIdPrefix: com.infiltrate
  deploymentTarget:
    iOS: "15.0"

targets:
  ShellApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      # Compose Multiplatform resources (fonts etc. used by the real MainMenu screen) - see the
      # "sync Compose Multiplatform resources" CI step comment and .junie/guidelines.md "AdMob
      # (basic-ads) feasibility spike" for the full story of how this was found missing (a real
      # crash, MissingResourceException for bebas_neue_regular.ttf, nothing to do with AdMob).
      # `type: folder` = Xcode folder reference (preserves the composeResources/... substructure
      # underneath, copied verbatim) rather than a flattening group.
      - path: ../paywall-build/build/compose/cocoapods/compose-resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infiltrate.shadowheist
        DEVELOPMENT_TEAM: AGLKGW9XC9
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # GameMain.framework and PaywallModule.framework are both built from Kotlin/Native
        # (iosSimulatorArm64 for simulator, iosArm64 for physical device / TestFlight).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
          - "$(PROJECT_DIR)/../build/bin/iosSimulatorArm64/debugFramework"
          - "$(PROJECT_DIR)/../paywall-build/build/bin/iosSimulatorArm64/podDebugFramework"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Shadow Heist
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "19"
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        # This is a side-scrolling stealth game - both KorGE gameplay and the Compose menu/
        # Store/Settings screens are laid out assuming a landscape-wide canvas (see e.g.
        # StoreScreen.kt's `scale = screenHeight / 720.dp`, which assumes 720 is the SHORT
        # (height) dimension of a landscape screen). With no orientation restriction here at
        # all, the default Xcode template behavior supports portrait too, and portrait renders
        # every screen squished into a narrow column - text wrapping character-by-character,
        # and (more importantly) breaks touch targets sized/positioned for the intended
        # landscape layout. Android already locks this via
        # android:screenOrientation="landscape" in android-shell's AndroidManifest.xml; this is
        # the iOS equivalent. Both keys needed since TARGETED_DEVICE_FAMILY above covers iPad
        # too, which reads the ~ipad-suffixed key separately from the iPhone one.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # android-shell's MainActivity.kt calls hideSystemBars() for the same reason: this is a
        # fullscreen game whose own top HUD/menu bar spans edge-to-edge, with no safe-area inset
        # padding reserved for a system status bar. Without this, the status bar (clock/battery/
        # signal, plus the Dynamic Island cutout on newer models) renders on top of that content,
        # visually blocking/overlapping it - reported as "parts of the screen blocked by that
        # thing at the top". UIViewControllerBasedStatusBarAppearance defaults to true, which
        # would make this app-wide key get ignored in favor of each UIViewController's own
        # prefersStatusBarHidden (Compose's ComposeUIViewController and KorGE's own
        # UIViewController don't override it) - setting it false here makes this single key
        # authoritative for every screen instead of needing a per-VC override on both frameworks.
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # Compose Multiplatform's ComposeUIViewController deliberately crashes (via its own
        # PlistSanityCheck, dispatched on a low-priority background queue - see
        # .junie/guidelines.md for the full trace) if this is missing/false. Unrelated to the
        # switch-spike mechanism itself; needed by any Compose-on-iOS app regardless.
        CADisableMinimumFrameDurationOnPhone: true
        # Google Mobile Ads SDK's own requirement - GADMobileAds.sharedInstance().start(...)
        # (called from BasicAds.Initialize()) throws GADInvalidInitializationException
        # (crashed the app: GADApplicationVerifyPublisherInitializedCorrectly, confirmed from a
        # real on-device crash report, see .junie/guidelines.md "AdMob (basic-ads) feasibility
        # spike") if this key is missing. Real iOS AdMob app ID - safe to use even in CI/dev
        # (unlike a real *ad unit* ID, the App ID alone doesn't cause invalid-traffic risk; the
        # CI spike still only ever requests basic-ads' test ad unit constants, never a real one).
        GADApplicationIdentifier: "ca-app-pub-7912148730700666~1768074863"
        # The App Tracking Transparency prompt's body text (AppDelegate.swift's
        # requestTrackingAuthorization) - iOS crashes the app on the request if this is missing.
        # Ads are personalized, which on iOS means reading the IDFA once the player allows it.
        NSUserTrackingUsageDescription: "Allowing tracking lets us show you ads that are more relevant to you. The game stays free either way."
        # Google's own network first, then Google's recommended third-party buyers - copied verbatim
        # from https://developers.google.com/admob/ios/3p-skadnetworks (list dated 2025-04-02).
        # Lets those buyers attribute installs from ads shown here, which is what lets them bid;
        # re-copy the whole list from that page rather than hand-editing it.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: "cstr6suwn9.skadnetwork"
          - SKAdNetworkIdentifier: "4fzdc2evr5.skadnetwork"
          - SKAdNetworkIdentifier: "2fnua5tdw4.skadnetwork"
