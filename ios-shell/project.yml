name: ShellApp
options:
  bundleIdPrefix: com.infiltrate
  deploymentTarget:
    iOS: "15.0"

targets:
  ShellApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      # Compose Multiplatform resources (fonts etc. used by the real MainMenu screen) - see the
      # "sync Compose Multiplatform resources" CI step comment and .junie/guidelines.md "AdMob
      # (basic-ads) feasibility spike" for the full story of how this was found missing (a real
      # crash, MissingResourceException for bebas_neue_regular.ttf, nothing to do with AdMob).
      # `type: folder` = Xcode folder reference (preserves the composeResources/... substructure
      # underneath, copied verbatim) rather than a flattening group.
      - path: ../paywall-build/build/compose/cocoapods/compose-resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infiltrate.shellapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # GameMain.framework and PaywallModule.framework are both built from the Kotlin/Native
        # iosSimulatorArm64 target only (arm64, no x86_64 slice). Without this, a plain
        # `xcodebuild -sdk iphonesimulator` build (no -destination given) defaults to building
        # BOTH arm64 and x86_64 simulator slices, and the x86_64 link fails with "Undefined
        # symbols" because ld just ignores the arm64-only .framework files for that arch -
        # confirmed exactly this way in CI on 2026-08-31. This is the standard fix for an
        # Apple-Silicon-only binary framework, independent of whatever -destination gets picked.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../build/bin/iosSimulatorArm64/debugFramework"
          # NOT debugFramework: paywall-build's framework is now declared via
          # cocoapods { framework { ... } } (see .junie/guidelines.md "AdMob (basic-ads)
          # feasibility spike", attempt 3), which reconfigures the plugin's own auto-created
          # binary - Gradle-internal name "podDebugFramework" for the debug build (confirmed
          # from Kotlin's own NativeBinary.outputDirectoryProperty source:
          # build/bin/<target>/<binary.name>, and binary.name here literally is
          # "podDebugFramework" - matches the linkPodDebugFrameworkIosSimulatorArm64 task name
          # exactly). The old plain "debugFramework" directory no longer exists at all.
          - "$(PROJECT_DIR)/../paywall-build/build/bin/iosSimulatorArm64/podDebugFramework"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Shadow Heist Shell
        UILaunchScreen: {}
        # Compose Multiplatform's ComposeUIViewController deliberately crashes (via its own
        # PlistSanityCheck, dispatched on a low-priority background queue - see
        # .junie/guidelines.md for the full trace) if this is missing/false. Unrelated to the
        # switch-spike mechanism itself; needed by any Compose-on-iOS app regardless.
        CADisableMinimumFrameDurationOnPhone: true
        # Google Mobile Ads SDK's own requirement - GADMobileAds.sharedInstance().start(...)
        # (called from BasicAds.Initialize()) throws GADInvalidInitializationException
        # (crashed the app: GADApplicationVerifyPublisherInitializedCorrectly, confirmed from a
        # real on-device crash report, see .junie/guidelines.md "AdMob (basic-ads) feasibility
        # spike") if this key is missing. Real iOS AdMob app ID - safe to use even in CI/dev
        # (unlike a real *ad unit* ID, the App ID alone doesn't cause invalid-traffic risk; the
        # CI spike still only ever requests basic-ads' test ad unit constants, never a real one).
        GADApplicationIdentifier: "ca-app-pub-7912148730700666~1768074863"
    dependencies:
      # Paths are relative to this file (ios-shell/project.yml). :game's GameMain.framework path
      # is confirmed against a real CI log (see .junie/guidelines.md, "LOCKED WORKING
      # CONFIGURATION"); paywall-build's PaywallModule.framework path is the cocoapods-plugin
      # output location (see the FRAMEWORK_SEARCH_PATHS comment above for why it's
      # "podDebugFramework", not the default "debugFramework").
      - framework: ../build/bin/iosSimulatorArm64/debugFramework/GameMain.framework
        embed: true
        codeSign: false
      - framework: ../paywall-build/build/bin/iosSimulatorArm64/podDebugFramework/PaywallModule.framework
        embed: true
        codeSign: false
