    dependencies:
      - framework: Frameworks/GameMain.framework
        embed: true
        codeSign: true
      - framework: Frameworks/PaywallModule.framework
        embed: true
        codeSign: true
      - sdk: StoreKit.framework
    postbuildScripts:
      # Real bug found via the console diagnostic added to GameplayScene.kt's asset-loading
      # catch block + a CI screenshot proving the game reaches gameplay at all: korlibs threw
      # "File case not matched" for resources/player/idle/0001.png. That message is misleading -
      # confirmed by downloading a real CI-built ShellApp.app and inspecting it directly: there is
      # no player/ anywhere in the bundle, and Frameworks/GameMain.framework contains only the
      # compiled binary + Info.plist, no resources at all. GameMain.framework never embeds :game's
      # root resources/ folder - only KorGE's own generated Xcode project (build/platforms/ios/
      # app, NOT used by this hand-authored shell) has a Copy Bundle Resources phase for it.
      # korlibs' resourcesVfs on iOS resolves against NSBundle.mainBundle's own directory (see
      # StandardBasePathsDarwin.executableFolder / applicationVfs in
      # korlibs-io-iossimulatorarm64's sources) - i.e. ShellApp.app's own bundle root, not
      # GameMain.framework's bundle - so resources need to land flat there, e.g.
      # ShellApp.app/player/idle/0001.png, not nested under a resources/ subfolder. Hence rsync
      # copies resources/*'s CONTENTS (trailing slash on source, not dest) straight into the app
      # bundle root, mirroring what KorGE's own generated project does automatically.
      - name: "Embed :game's resources/ (sprites, audio, level data) into the app bundle root"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="${SRCROOT}/../resources"
          DEST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          echo "Copying game resources from $SRC to $DEST"
          rsync -a --exclude='.*' "$SRC/" "$DEST/"

      # Real gap found via a CI step that inspects a built ShellApp.app directly (see
      # ios-build.yml's "check for AdMob/RevenueCat privacy manifest" step): AdMob's
      # GoogleMobileAdsResources.bundle was confirmed absent from the shipped app. Root cause -
      # paywall-build/build.gradle.kts's cocoapods{} block builds Google-Mobile-Ads-SDK in its OWN
      # synthetic Xcode project under paywall-build/build/cocoapods/synthetic/ios/ (Kotlin/Native's
      # cocoapods plugin does this to produce a .framework for cinterop/linking), completely
      # separate from this app's own build tree. Xcode's usual "Copy Pods Resources" phase - which
      # would normally carry it into the app automatically - only exists for a project with its own
      # Podfile, and this one (ios-shell) deliberately has none (see build.gradle.kts's
      # noPodspec() comment). AdMob reads data out of this bundle at runtime (fraud/invalid-traffic
      # signals) - missing it risks ad misbehavior even where it isn't an outright upload rejection.
      #
      # The privacy MANIFEST itself (PrivacyInfo.xcprivacy) is handled separately, NOT by copying
      # AdMob's raw file here: RevenueCat's own SDK ships one too (confirmed via its GitHub source -
      # NSPrivacyAccessedAPICategoryUserDefaults, reason CA92.1) but it never survives the KMP
      # wrapper's cinterop step (confirmed absent from this whole build tree, Gradle caches, and
      # Konan caches via a CI search), so there was nothing to copy for RevenueCat the way there was
      # for AdMob. An app can only have one top-level manifest, so Resources/PrivacyInfo.xcprivacy
      # is a hand-authored merge of both SDKs' real, current NSPrivacyAccessedAPITypes entries
      # (fetched live: AdMob 13.8.0's via this project's own CI build, RevenueCat's from its public
      # GitHub source) - not this raw copy, which would have silently dropped RevenueCat's
      # UserDefaults declaration the moment it got overwritten by AdMob's file verbatim.
      #
      # The resource bundle path is located with `find` rather than hardcoded to the one build the
      # CI diagnostic actually exercised (Debug-iphonesimulator): Kotlin's synthetic project's own
      # intermediate directory naming for a device/Release build was never observed directly (no
      # device/archive build has been run in this environment), so hardcoding that path would be
      # exactly the kind of unverified guess this fix is trying to avoid.
      - name: "Embed AdMob's resource bundle into the app bundle root"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          POD_ROOT="${SRCROOT}/../paywall-build/build/cocoapods/synthetic/ios"

          RESOURCES_BUNDLE=$(find "$POD_ROOT/build" -type d -name "GoogleMobileAdsResources.bundle" 2>/dev/null | head -n 1)
          if [ -n "$RESOURCES_BUNDLE" ]; then
            echo "Copying $RESOURCES_BUNDLE to $DEST"
            rsync -a "$RESOURCES_BUNDLE" "$DEST/"
          else
            echo "warning: GoogleMobileAdsResources.bundle not found under $POD_ROOT/build - AdMob ads may misbehave."
          fi
